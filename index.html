<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Distributive Property Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Nunito:wght@700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Light green background to match video */
            touch-action: manipulation;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .math-font {
            font-family: 'Nunito', sans-serif;
        }

        .mode-btn {
            transition: all 0.2s;
            border-bottom: 4px solid rgba(0,0,0,0.1);
        }
        .mode-btn:active {
            transform: translateY(2px);
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .mode-btn.active {
            filter: brightness(0.9);
            border-bottom: 2px solid rgba(0,0,0,0.1);
            transform: translateY(2px);
        }

        /* Pacman Image Styling */
        .pacman-wrapper {
            position: relative;
            width: 55px; height: 55px;
            min-width: 55px; min-height: 55px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .pacman-open, .pacman-closed {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transition: transform 0.2s;
        }
        .pacman-closed {
            opacity: 0;
        }
        .chomp .pacman-open {
            animation: eat-open 0.5s infinite;
        }
        .chomp .pacman-closed {
            animation: eat-closed 0.5s infinite;
        }
        @keyframes eat-open {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0; transform: scale(1.05); }
        }
        @keyframes eat-closed {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Dragging & Targets */
        .drag-source {
            display: inline-block;
            cursor: grab;
            transition: transform 0.2s;
            z-index: 20;
            position: relative;
        }
        .drag-source:active { cursor: grabbing; }

        .target-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 80px;
            margin-top: -30px; /* Overlap slightly */
        }
        .item-slot {
            height: 40px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 5px;
            transition: all 0.3s;
        }
        
        .dropped-item {
            animation: dropBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes dropBounce {
            0% { transform: translateY(-20px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Brackets */
        .bracket {
            font-size: 3.5rem;
            color: #374151; /* Dark gray */
            transition: all 0.5s;
            display: inline-block;
        }
        .bracket.hide {
            opacity: 0;
            transform: scale(0.5);
            width: 0;
            margin: 0;
            overflow: hidden;
        }

        /* Custom Keyboard */
        .keyboard-key {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            height: 3.5rem;
            transition: background 0.1s;
        }
        .keyboard-key:active { background: #e5e7eb; }
        
        .term-input {
            min-width: 60px;
            height: 50px;
            border-bottom: 3px solid #9ca3af;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 5px;
            cursor: pointer;
            padding: 0 10px;
        }
        .term-input.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
        }

        #drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            display: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        .highlight-target {
            background: rgba(74, 222, 128, 0.2);
            border-radius: 1rem;
            outline: 2px dashed #4ade80;
        }
        
        .stage-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 2rem 1rem;
            width: 100%;
            max-w: 600px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Top Green Bar -->
    <div class="h-4 bg-green-500 w-full"></div>

    <header class="p-4 flex justify-between items-center z-10">
        <div class="font-bold text-gray-500">Distributive Property</div>
        <button id="lang-toggle" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300 transition">中文</button>
    </header>

    <!-- Mode Selection Grid -->
    <div class="bg-[#dcfce7] p-4 mx-4 rounded-2xl flex flex-wrap justify-center gap-3 shadow-sm max-w-2xl sm:mx-auto">
        <button class="mode-btn px-4 py-2 bg-green-500 text-white rounded-xl font-bold" data-mode="demo1" data-step="1">Example 1</button>
        <button class="mode-btn px-4 py-2 bg-green-400 text-white rounded-xl font-bold" data-mode="demo1" data-step="2">Example 2</button>
        <button class="mode-btn px-4 py-2 bg-green-400 text-white rounded-xl font-bold" data-mode="demo1" data-step="3">Example 3</button>
        <button class="mode-btn px-4 py-2 bg-green-300 text-gray-800 rounded-xl font-bold" data-mode="demo1" data-step="4">Example 4</button>
        <button class="mode-btn px-4 py-2 bg-purple-300 text-purple-900 rounded-xl font-bold" data-mode="demo2">Demo 2</button>
        <button class="mode-btn px-4 py-2 bg-orange-300 text-orange-900 rounded-xl font-bold" data-mode="play1">Play Mode 1</button>
        <button class="mode-btn px-4 py-2 bg-pink-300 text-pink-900 rounded-xl font-bold" data-mode="play2">Play Mode 2</button>
    </div>

    <!-- Main Game Area -->
    <main class="flex-1 w-full px-4 py-6 flex flex-col items-center">
        
        <!-- Instruction Text -->
        <div class="bg-white px-6 py-4 rounded-2xl shadow-sm mb-6 w-full max-w-2xl text-center border border-gray-100">
            <h2 id="instruction-text" class="text-xl font-bold text-gray-800">
                Please award the apple to two people
            </h2>
        </div>

        <!-- Stage Card -->
        <div class="stage-card relative overflow-hidden" id="stage-card">
            
            <!-- Original Equation Row -->
            <div id="row-1" class="flex items-center text-4xl gap-3 transition-all duration-700 font-bold math-font relative z-10">
                <!-- Populated by JS -->
            </div>

            <!-- Expanded Result Row (Hidden initially) -->
            <div id="row-2" class="flex items-center text-4xl gap-3 mt-6 opacity-0 transition-opacity duration-700 font-bold math-font hidden z-10">
                <!-- Populated by JS -->
            </div>

            <!-- Input Result Row (For Play Mode) -->
            <div id="row-input" class="flex items-center flex-wrap justify-center text-3xl gap-2 mt-6 opacity-0 transition-opacity duration-700 font-bold math-font hidden w-full z-10">
                <div class="mx-2">=</div>
                <div id="input-t1" class="term-input active" onclick="setActiveInput('t1')"></div>
                <div id="input-op" class="term-input w-12 text-center" onclick="toggleOperator()">+</div>
                <div id="input-t2" class="term-input" onclick="setActiveInput('t2')"></div>
                <button id="check-btn" class="ml-4 px-6 py-2 bg-blue-500 text-white rounded-lg text-xl shadow-md active:translate-y-1">Check</button>
            </div>
            
            <!-- Play Mode 2 Specific Multi-step input -->
             <div id="row-input-pm2" class="flex items-center flex-wrap justify-center text-3xl gap-2 mt-6 opacity-0 transition-opacity duration-700 font-bold math-font hidden w-full z-10">
                <div class="mx-2">=</div>
                <div id="pm2-t1" class="term-input active" onclick="setActiveInput('pm2_t1')"></div>
                <div id="pm2-op1" class="term-input w-10 text-center" onclick="toggleOperatorPM2(1)">+</div>
                <div id="pm2-t2" class="term-input" onclick="setActiveInput('pm2_t2')"></div>
                <div id="pm2-op2" class="term-input w-10 text-center" onclick="toggleOperatorPM2(2)">+</div>
                <div id="pm2-t3" class="term-input" onclick="setActiveInput('pm2_t3')"></div>
                <button id="check-btn-pm2" class="ml-4 px-4 py-2 bg-blue-500 text-white rounded-lg text-lg shadow-md active:translate-y-1">Check</button>
            </div>

            <!-- Feedback Bubble -->
            <div id="feedback-bubble" class="absolute right-4 top-4 px-4 py-2 rounded-xl text-white font-bold opacity-0 transition-opacity duration-300 hidden">
                <span id="feedback-icon"></span> <span id="feedback-msg"></span>
            </div>
        </div>

        <!-- Next Button -->
        <button id="next-btn" class="mt-8 px-10 py-3 bg-blue-500 text-white rounded-full text-xl font-bold shadow-lg hover:bg-blue-600 active:scale-95 transition hidden">
            Next
        </button>

    </main>

    <!-- Custom Keyboard -->
    <div id="keyboard" class="fixed bottom-0 left-0 w-full bg-gray-200 p-2 shadow-[0_-4px_6px_rgba(0,0,0,0.1)] transform translate-y-full transition-transform duration-300 z-50">
        <div class="max-w-3xl mx-auto flex flex-col gap-2 relative">
             <button onclick="hideKeyboard()" class="absolute -top-10 right-2 bg-gray-300 px-4 py-1 rounded-t-lg font-bold text-gray-700 shadow-sm">▼ Close</button>
            <!-- Page 1: Numbers -->
            <div id="kb-page-1" class="grid grid-cols-4 gap-2">
                <button class="keyboard-key" onclick="typeKey('7')">7</button>
                <button class="keyboard-key" onclick="typeKey('8')">8</button>
                <button class="keyboard-key" onclick="typeKey('9')">9</button>
                <button class="keyboard-key bg-red-100 text-red-600" onclick="typeKey('BACK')">⌫</button>
                
                <button class="keyboard-key" onclick="typeKey('4')">4</button>
                <button class="keyboard-key" onclick="typeKey('5')">5</button>
                <button class="keyboard-key" onclick="typeKey('6')">6</button>
                <button class="keyboard-key bg-blue-100 text-blue-600 text-lg" onclick="toggleKbPage()">xy²...</button>
                
                <button class="keyboard-key" onclick="typeKey('1')">1</button>
                <button class="keyboard-key" onclick="typeKey('2')">2</button>
                <button class="keyboard-key" onclick="typeKey('3')">3</button>
                <button class="keyboard-key text-blue-500" onclick="typeKey('+')">+</button>
                
                <button class="keyboard-key col-span-2" onclick="typeKey('0')">0</button>
                <button class="keyboard-key" onclick="typeKey('.')">.</button>
                <button class="keyboard-key text-red-500" onclick="typeKey('-')">-</button>
            </div>

            <!-- Page 2: Letters and Powers -->
            <div id="kb-page-2" class="grid grid-cols-4 gap-2 hidden">
                <button class="keyboard-key" onclick="typeKey('x')">x</button>
                <button class="keyboard-key" onclick="typeKey('y')">y</button>
                <button class="keyboard-key" onclick="typeKey('a')">a</button>
                <button class="keyboard-key bg-red-100 text-red-600" onclick="typeKey('BACK')">⌫</button>
                
                <button class="keyboard-key" onclick="typeKey('b')">b</button>
                <button class="keyboard-key" onclick="typeKey('c')">c</button>
                <button class="keyboard-key" onclick="typeKey('d')">d</button>
                <button class="keyboard-key bg-blue-100 text-blue-600 text-lg" onclick="toggleKbPage()">123...</button>
                
                <button class="keyboard-key" onclick="typeKey('²')">²</button>
                <button class="keyboard-key" onclick="typeKey('³')">³</button>
                <button class="keyboard-key" onclick="typeKey('⁴')">⁴</button>
                <button class="keyboard-key text-blue-500" onclick="typeKey('+')">+</button>
            </div>
        </div>
    </div>

    <div id="drag-ghost"></div>

    <script>
        const dict = {
            en: {
                demo1_ex1: "Please award the apple to two people",
                demo1_ex2: "Please award the watermelon to two people",
                demo1_ex3: "Please award 5 into the bracket",
                demo1_ex4: "Expand the mathematical expression",
                demo2: "Expand the brackets sequentially",
                demo2_1: "Expand and calculate",
                play1: "Expand and simplify",
                play2: "Expand step by step, then combine like terms",
                next: "Next",
                check: "Check",
                term1: "Term 1",
                term2: "Term 2",
                real_ans: "Correct Answer: "
            },
            zh: {
                demo1_ex1: "請獎勵蘋果給兩人",
                demo1_ex2: "請獎勵西瓜給兩人",
                demo1_ex3: "請獎勵 5 給括號的數字",
                demo1_ex4: "展開以下數式",
                demo2: "順序分配括號內的項目",
                demo2_1: "展開並計算",
                play1: "展開並化簡",
                play2: "先各自化簡，再合併同類項",
                next: "下一題",
                check: "檢查",
                term1: "項 1",
                term2: "項 2",
                real_ans: "正確答案: "
            }
        };

        const state = {
            lang: 'en',
            mode: 'demo1',
            step: 1,
            
            // Current problem data
            multiplier: '',
            term1: '',
            term2: '',
            operator: '+',
            mult2: '', // For (a+b)(c+d)
            
            // Interaction State
            dragMode: 'single', // single, double (for demo2)
            targetsHit: 0,
            requiredHits: 2,
            isCompleted: false,
            
            // Input Mode State
            activeInput: 't1',
            inputs: { t1: '', op: '+', t2: '' },
            pm2_inputs: { t1: '', op1: '+', t2: '', op2: '+', t3: '' },
            correctAnswer: null, // string or object
            
            dragItemType: 1 // 1 for first item in demo2, 2 for second
        };

        const els = {
            instr: document.getElementById('instruction-text'),
            row1: document.getElementById('row-1'),
            row2: document.getElementById('row-2'),
            rowInput: document.getElementById('row-input'),
            rowInputPM2: document.getElementById('row-input-pm2'),
            nextBtn: document.getElementById('next-btn'),
            ghost: document.getElementById('drag-ghost'),
            kb: document.getElementById('keyboard'),
            bubble: document.getElementById('feedback-bubble'),
            msg: document.getElementById('feedback-msg'),
            icon: document.getElementById('feedback-icon')
        };

        const HTML_SMILEY = `
            <div class="pacman-wrapper">
                <svg class="pacman-open" viewBox="0 0 100 100">
                    <path d="M 18 26 A 40 40 0 1 1 18 74 L 45 50 Z" stroke="#dc2626" stroke-width="6" fill="none" stroke-linejoin="round"/>
                    <circle cx="65" cy="35" r="7" fill="#dc2626" />
                </svg>
                <svg class="pacman-closed" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" stroke="#dc2626" stroke-width="6" fill="none"/>
                    <line x1="10" y1="50" x2="45" y2="50" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="65" cy="35" r="7" fill="#dc2626" />
                </svg>
            </div>
        `;
        const HTML_DOT = `<span class="mx-1 text-2xl font-bold">·</span>`;

        function init() {
            document.getElementById('lang-toggle').addEventListener('click', () => {
                state.lang = state.lang === 'en' ? 'zh' : 'en';
                document.getElementById('lang-toggle').innerText = state.lang === 'en' ? '中文' : 'English';
                updateUI();
            });

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active', 'ring-4', 'ring-white'));
                    e.target.classList.add('active', 'ring-4', 'ring-white');
                    
                    state.mode = e.target.dataset.mode;
                    state.step = parseInt(e.target.dataset.step) || 1;
                    
                    // Special case for demo2 sequence
                    if(state.mode === 'demo2' && e.target.innerText === 'Demo 2') {
                        // Allow stepping inside demo2 logic later if needed
                        state.step = 1; 
                    }
                    loadScene();
                });
            });

            els.nextBtn.addEventListener('click', () => {
                // Chomp animation
                document.querySelectorAll('.pacman-wrapper').forEach(p => p.classList.add('chomp'));
                setTimeout(() => {
                    if(state.mode === 'demo1') {
                        state.step = state.step < 4 ? state.step + 1 : 1;
                        document.querySelector(`.mode-btn[data-mode="demo1"][data-step="${state.step}"]`)?.click();
                    } else if (state.mode === 'play1') {
                        loadScene(); // Reload random
                    } else if (state.mode === 'play2') {
                        loadScene();
                    } else if (state.mode === 'demo2') {
                        if(state.step === 1) state.step = 2; // Move to demo 2.1
                        else state.step = 1;
                        loadScene();
                    }
                }, 600);
            });

            document.getElementById('check-btn').addEventListener('click', checkPlay1Answer);
            document.getElementById('check-btn-pm2').addEventListener('click', checkPlay2Answer);

            // Default click
            document.querySelector('.mode-btn[data-mode="demo1"][data-step="1"]').click();
        }

        function updateUI() {
            const d = dict[state.lang];
            
            // Instruction
            if(state.mode === 'demo1') {
                els.instr.innerText = d[`demo1_ex${state.step}`];
            } else if (state.mode === 'demo2') {
                els.instr.innerText = state.step === 1 ? d.demo2 : d.demo2_1;
            } else if (state.mode === 'play1') {
                els.instr.innerText = d.play1;
                // Update placeholder texts
                if(!state.inputs.t1) document.getElementById('input-t1').innerHTML = `<span class="text-gray-300 text-lg">${state.lang==='en'?'Term 1':'項 1'}</span>`;
                if(!state.inputs.t2) document.getElementById('input-t2').innerHTML = `<span class="text-gray-300 text-lg">${state.lang==='en'?'Term 2':'項 2'}</span>`;
            } else if (state.mode === 'play2') {
                els.instr.innerText = d.play2;
            }

            els.nextBtn.innerText = d.next;
            document.getElementById('check-btn').innerText = d.check;
            document.getElementById('check-btn-pm2').innerText = d.check;
        }

        // --- STREAMING_CHUNK:Scene generation and rendering... ---
        function loadScene() {
            state.targetsHit = 0;
            state.isCompleted = false;
            state.dragItemType = 1;
            els.nextBtn.classList.add('hidden');
            els.row2.classList.add('hidden');
            els.row2.style.opacity = '0';
            els.rowInput.classList.add('hidden');
            els.rowInputPM2.classList.add('hidden');
            hideKeyboard();
            hideFeedback();

            if (state.mode === 'demo1') {
                state.dragMode = 'single';
                if (state.step === 1) setupEq('🍎', 'SMILEY', 'SMILEY', '+');
                if (state.step === 2) setupEq('🍉', 'SMILEY', 'SMILEY', '+');
                if (state.step === 3) setupEq('<span class="text-red-500">5</span>', 'SMILEY', 'SMILEY', '+');
                if (state.step === 4) setupEq('<span class="text-red-500">5</span>', 'x', '12', '+');
            } else if (state.mode === 'demo2') {
                 state.dragMode = 'double';
                 if (state.step === 1) {
                     // (🍎+🍉)(SMILEY+SMILEY)
                     state.multiplier = '🍎';
                     state.mult2 = '🍉';
                     state.term1 = 'SMILEY';
                     state.term2 = 'SMILEY';
                 } else {
                     // (3+5)(🍎+🍉) -> Demo 2.1
                     state.multiplier = '<span class="text-red-500">3</span>';
                     state.mult2 = '<span class="text-blue-500">5</span>';
                     state.term1 = '🍎';
                     state.term2 = '🍉';
                     state.operator = '+';
                 }
                 state.requiredHits = 4;
            } else if (state.mode === 'play1') {
                state.dragMode = 'single';
                generatePlay1();
            } else if (state.mode === 'play2') {
                state.dragMode = 'double';
                generatePlay2();
            }

            renderRow1();
            updateUI();
            setupDrag();
        }

        function setupEq(m, t1, t2, op) {
            state.multiplier = m;
            state.term1 = t1;
            state.term2 = t2;
            state.operator = op;
            state.requiredHits = 2;
        }

        function generatePlay1() {
            const a = Math.floor(Math.random() * 8) + 2; 
            const b = Math.floor(Math.random() * 8) + 2; 
            const c = Math.floor(Math.random() * 8) + 2;
            const op = Math.random() > 0.5 ? '+' : '-';
            const vars = ['x', 'y', 'a', 'b'];
            const v = vars[Math.floor(Math.random() * vars.length)];

            setupEq(`<span class="text-red-500">${a}</span>`, `${b}${v}`, `${c}`, op);
            
            state.correctAnswer = { t1: `${a*b}${v}`, op: op, t2: `${a*c}` };
            state.inputs = { t1: '', op: '+', t2: '' };
            updateInputDisplay();
        }

        function generatePlay2() {
            // (x+a)(x+b)
            const v = ['x', 'y'][Math.floor(Math.random() * 2)];
            const a = Math.floor(Math.random() * 5) + 1;
            const b = Math.floor(Math.random() * 5) + 1;
            
            state.multiplier = `<span class="text-red-500">${v}</span>`;
            state.mult2 = `<span class="text-blue-500">${a}</span>`;
            state.term1 = v;
            state.term2 = b;
            state.operator = '+';
            state.requiredHits = 4;

            // correct final: x^2 + (a+b)x + ab
            state.correctAnswer = {
                t1: `${v}²`,
                op1: '+',
                t2: `${a+b}${v}`,
                op2: '+',
                t3: `${a*b}`
            };
            state.pm2_inputs = { t1: '', op1: '+', t2: '', op2: '+', t3: '' };
            updatePM2InputDisplay();
        }

        function getRenderHTML(val) {
            if (val === 'SMILEY') return HTML_SMILEY;
            return val; // Returns raw HTML for emoji or numbers
        }

        function renderRow1() {
            let html = '';
            
            if (state.dragMode === 'single') {
                html = `
                    <div id="drag-source-1" class="drag-source text-5xl hover:scale-110 active:scale-95" data-val="${state.multiplier.replace(/"/g, '&quot;')}">${state.multiplier}</div>
                    <div class="bracket" id="b-left">(</div>
                    <div class="target-area" id="target-1">
                        <div class="item-slot" id="slot-1"></div>
                        <div>${getRenderHTML(state.term1)}</div>
                    </div>
                    <div class="text-4xl px-2">${state.operator}</div>
                    <div class="target-area" id="target-2">
                        <div class="item-slot" id="slot-2"></div>
                        <div>${getRenderHTML(state.term2)}</div>
                    </div>
                    <div class="bracket" id="b-right">)</div>
                `;
            } else if (state.dragMode === 'double') {
                // Demo 2 or Play 2 format: (A + B)(C + D)
                html = `
                    <div class="bracket" id="b1-left">(</div>
                    <div id="drag-source-1" class="drag-source text-5xl hover:scale-110 active:scale-95 z-20" data-val="${state.multiplier.replace(/"/g, '&quot;')}">${state.multiplier}</div>
                    <div class="text-4xl px-2">+</div>
                    <div id="drag-source-2" class="drag-source text-5xl hover:scale-110 active:scale-95 z-20 opacity-50 pointer-events-none" data-val="${state.mult2.replace(/"/g, '&quot;')}">${state.mult2}</div>
                    <div class="bracket" id="b1-right">)</div>
                    
                    <div class="bracket ml-2" id="b-left">(</div>
                    <div class="target-area" id="target-1">
                        <div class="item-slot" id="slot-1"></div>
                        <div>${getRenderHTML(state.term1)}</div>
                    </div>
                    <div class="text-4xl px-2">${state.operator}</div>
                    <div class="target-area" id="target-2">
                        <div class="item-slot" id="slot-2"></div>
                        <div>${getRenderHTML(state.term2)}</div>
                    </div>
                    <div class="bracket" id="b-right">)</div>
                `;
            }

            els.row1.innerHTML = html;
        }

        // --- STREAMING_CHUNK:Interaction Logic (Drag & Drop)... ---
        function setupDrag() {
            let activeSource = null;
            let isDragging = false;
            let currentTarget = null;

            function down(e) {
                const el = e.target.closest('.drag-source');
                if(!el) return;
                
                // Only allow dragging current active type in double mode
                if(state.dragMode === 'double') {
                    if(el.id === 'drag-source-1' && state.dragItemType !== 1) return;
                    if(el.id === 'drag-source-2' && state.dragItemType !== 2) return;
                }

                activeSource = el;
                isDragging = true;
                els.ghost.innerHTML = el.dataset.val;
                els.ghost.style.display = 'block';
                move(e);
                e.preventDefault();
            }

            function move(e) {
                if(!isDragging) return;
                const touch = e.touches ? e.touches[0] : e;
                els.ghost.style.left = touch.clientX + 'px';
                els.ghost.style.top = touch.clientY + 'px';

                // Check collisions
                currentTarget = null;
                [1, 2].forEach(i => {
                    const t = document.getElementById(`target-${i}`);
                    if(!t) return;
                    const rect = t.getBoundingClientRect();
                    // Expanded hit area
                    if(touch.clientX > rect.left - 20 && touch.clientX < rect.right + 20 &&
                       touch.clientY > rect.top - 50 && touch.clientY < rect.bottom + 50) {
                        t.classList.add('highlight-target');
                        currentTarget = i;
                    } else {
                        t.classList.remove('highlight-target');
                    }
                });
            }

            function up(e) {
                if(!isDragging) return;
                isDragging = false;
                els.ghost.style.display = 'none';
                
                document.querySelectorAll('.target-area').forEach(t => t.classList.remove('highlight-target'));

                if(currentTarget) {
                    dropOnTarget(currentTarget, activeSource.dataset.val);
                }
                activeSource = null;
            }

            // Click support
            function clickHandle(e) {
                const el = e.target.closest('.drag-source');
                if(!el) return;
                if(state.dragMode === 'double') {
                    if(el.id === 'drag-source-1' && state.dragItemType !== 1) return;
                    if(el.id === 'drag-source-2' && state.dragItemType !== 2) return;
                }
                // Find empty slot
                if(!state.targetsHit || state.targetsHit % 2 === 0) dropOnTarget(1, el.dataset.val);
                else dropOnTarget(2, el.dataset.val);
            }

            const r1 = els.row1;
            // Clean old listeners
            const newR1 = r1.cloneNode(true);
            r1.parentNode.replaceChild(newR1, r1);
            els.row1 = newR1;

            els.row1.addEventListener('pointerdown', down);
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
            // Click to drop sequentially
            els.row1.addEventListener('click', (e) => {
                if(e.target.closest('.drag-source')) clickHandle(e);
            });
        }

        function dropOnTarget(targetNum, htmlVal) {
            // Prevent double drop in same phase
            const phaseHits = state.targetsHit % 2;
            if(targetNum === 1 && phaseHits !== 0) return;
            if(targetNum === 2 && phaseHits !== 1) return;

            state.targetsHit++;
            
            const slot = document.getElementById(`slot-${targetNum}`);
            const el = document.createElement('div');
            // If it's a number and target is not smiley, add dot
            let displayVal = htmlVal;
            if (htmlVal.includes('span') && state.term1 !== 'SMILEY') {
                displayVal = `${htmlVal}${HTML_DOT}`;
            }

            el.innerHTML = displayVal;
            el.className = 'dropped-item';
            slot.appendChild(el);

            if(state.targetsHit === 2 && state.dragMode === 'double') {
                // Phase 1 complete. Enable phase 2
                state.dragItemType = 2;
                document.getElementById('drag-source-1').classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('drag-source-2').classList.remove('opacity-50', 'pointer-events-none');
                // Clear slots visually by moving existing dropped items slightly up or grouping them
                // Actually, just let them stack since we set flex-direction: column-reverse
            }

            if(state.targetsHit === state.requiredHits) {
                triggerCompletion();
            }
        }

        // --- STREAMING_CHUNK:Animations and Next Stages... ---
        function triggerCompletion() {
            state.isCompleted = true;
            
            // Bracket Fall Animation
            document.querySelectorAll('.bracket').forEach(b => b.classList.add('hide'));

            setTimeout(() => {
                showResultRow();
            }, 800);
        }

        function showResultRow() {
            els.row2.classList.remove('hidden');
            // Force reflow
            void els.row2.offsetWidth;
            els.row2.style.opacity = '1';

            if (state.mode === 'demo1') {
                if (state.step === 4) {
                    els.row2.innerHTML = `= <span class="text-blue-600">5x + 60</span>`;
                } else {
                    let m = state.multiplier;
                    if(state.step===3) m = m + HTML_DOT;
                    els.row2.innerHTML = `= <div class="flex items-center">${m}${getRenderHTML(state.term1)}</div> 
                                          <div class="px-2">${state.operator}</div> 
                                          <div class="flex items-center">${m}${getRenderHTML(state.term2)}</div>`;
                }
                els.nextBtn.classList.remove('hidden');
                
            } else if (state.mode === 'demo2') {
                if(state.step === 1) {
                    els.row2.innerHTML = `= 
                        <div class="flex items-center">${state.multiplier}${getRenderHTML(state.term1)}</div> <div class="px-2">+</div> 
                        <div class="flex items-center">${state.multiplier}${getRenderHTML(state.term2)}</div> <div class="px-2">+</div> 
                        <div class="flex items-center">${state.mult2}${getRenderHTML(state.term1)}</div> <div class="px-2">+</div> 
                        <div class="flex items-center">${state.mult2}${getRenderHTML(state.term2)}</div>`;
                } else {
                    // Demo 2.1 specific logic - ask for input
                    els.row2.innerHTML = `= <div class="flex items-center">${state.term1}</div> <div class="px-2">+</div> <div class="flex items-center">${state.term2}</div>`;
                    
                    // Actually, requirement says show input for demo2.1.
                    // Let's repurpose play1 input logic for demo 2.1
                    state.mode = 'play1'; // Hijack play1 logic for simple input
                    state.correctAnswer = { t1: '8', op: '+', t2: '15' }; // Just dummy, wait, demo2.1 is (3+5)(🍎+🍉) -> = 🍎 + 🍉, need to put 3+5=8.
                    // Requirement: "= 🍎 + 🍉, 讓玩家輸入數字". Let's setup a specific input row.
                    els.row2.innerHTML = `= <div id="input-t1" class="term-input active" onclick="setActiveInput('t1')"></div>🍎 + <div id="input-t2" class="term-input" onclick="setActiveInput('t2')"></div>🍉`;
                    
                    state.correctAnswer = { t1: '3', op: '+', t2: '5' }; // Wait, (3+5)🍎 means 3🍎 + 5🍎 ? No, question says (3+5)(🍎+🍉) = 3🍎+3🍉+5🍎+5🍉 = 8🍎+8🍉.
                    // To keep it simple based on prompt: "顯示=🍎+🍉 ，讓玩家輸入數字" -> means _🍎 + _🍉
                    state.correctAnswer = { t1: '8', t2: '8' }; // Assuming they just add them.
                    els.row2.innerHTML += `<button id="check-btn-d2" class="ml-4 px-4 py-2 bg-blue-500 text-white rounded">Check</button>`;
                    document.getElementById('check-btn-d2').addEventListener('click', () => {
                         if(state.inputs.t1 === '8' && state.inputs.t2 === '8') {
                             showFeedback(true);
                             els.nextBtn.classList.remove('hidden');
                         } else {
                             showFeedback(false, "8");
                         }
                    });
                    showKeyboard();
                }
                if(state.step===1) els.nextBtn.classList.remove('hidden');

            } else if (state.mode === 'play1') {
                els.row2.innerHTML = `= <div class="flex items-center">${state.multiplier}${HTML_DOT}${state.term1}</div> 
                                      <div class="px-2">${state.operator}</div> 
                                      <div class="flex items-center">${state.multiplier}${HTML_DOT}${state.term2}</div>`;
                
                setTimeout(() => {
                    els.rowInput.classList.remove('hidden');
                    void els.rowInput.offsetWidth;
                    els.rowInput.style.opacity = '1';
                    showKeyboard();
                    updateUI(); // refresh placeholders
                }, 1000);
            } else if (state.mode === 'play2') {
                // Show intermediate step: x(x+b) + a(x+b)
                els.row2.innerHTML = `= <span class="text-red-500">${state.term1}</span>(${state.term1}+${state.term2}) + <span class="text-blue-500">${state.mult2.replace(/<[^>]*>?/gm, '')}</span>(${state.term1}+${state.term2})`;
                
                setTimeout(() => {
                    els.rowInputPM2.classList.remove('hidden');
                    void els.rowInputPM2.offsetWidth;
                    els.rowInputPM2.style.opacity = '1';
                    showKeyboard();
                }, 1000);
            }
        }

        // --- STREAMING_CHUNK:Keyboard and Validation Logic... ---
        function setActiveInput(id) {
            state.activeInput = id;
            document.querySelectorAll('.term-input').forEach(el => el.classList.remove('active'));
            document.getElementById(id.includes('pm2') ? id.replace('_', '-') : `input-${id}`).classList.add('active');
        }

        function toggleOperator() {
            state.inputs.op = state.inputs.op === '+' ? '-' : '+';
            updateInputDisplay();
            setTimeout(() => setActiveInput('t2'), 100);
        }
        
        function toggleOperatorPM2(num) {
            state.pm2_inputs[`op${num}`] = state.pm2_inputs[`op${num}`] === '+' ? '-' : '+';
            updatePM2InputDisplay();
            setTimeout(() => setActiveInput(`pm2_t${num+1}`), 100);
        }

        function typeKey(key) {
            let currentStr = '';
            let targetObj = null;
            let keyName = state.activeInput;

            if(state.mode === 'play2') {
                targetObj = state.pm2_inputs;
                keyName = state.activeInput.replace('pm2_', '');
            } else {
                targetObj = state.inputs;
            }

            currentStr = targetObj[keyName] || '';

            if (key === 'BACK') {
                currentStr = currentStr.slice(0, -1);
            } else {
                currentStr += key;
            }

            targetObj[keyName] = currentStr;

            if(state.mode === 'play2') updatePM2InputDisplay();
            else updateInputDisplay();
        }

        function updateInputDisplay() {
            const inT1 = document.getElementById('input-t1');
            const inT2 = document.getElementById('input-t2');
            if(inT1) inT1.innerText = state.inputs.t1;
            if(inT2) inT2.innerText = state.inputs.t2;
            const opEl = document.getElementById('input-op');
            if(opEl) opEl.innerText = state.lang === 'zh' ? (state.inputs.op === '+' ? '+' : '-') : state.inputs.op; // Based on req: 中文版+改為+/- wait, requirement says "中文版的 +改為+/-", actually meaning just show + or - based on state.
            if(opEl) opEl.innerText = state.inputs.op;
        }

        function updatePM2InputDisplay() {
            document.getElementById('pm2-t1').innerText = state.pm2_inputs.t1;
            document.getElementById('pm2-op1').innerText = state.pm2_inputs.op1;
            document.getElementById('pm2-t2').innerText = state.pm2_inputs.t2;
            document.getElementById('pm2-op2').innerText = state.pm2_inputs.op2;
            document.getElementById('pm2-t3').innerText = state.pm2_inputs.t3;
        }

        function showKeyboard() {
            els.kb.classList.remove('translate-y-full');
            document.querySelector('main').style.paddingBottom = '250px';
        }

        function hideKeyboard() {
            els.kb.classList.add('translate-y-full');
            document.querySelector('main').style.paddingBottom = '0';
        }

        function toggleKbPage() {
            document.getElementById('kb-page-1').classList.toggle('hidden');
            document.getElementById('kb-page-2').classList.toggle('hidden');
        }

        function checkPlay1Answer() {
            const { t1, op, t2 } = state.inputs;
            const ans = state.correctAnswer;
            
            if(t1 === ans.t1 && op === ans.op && t2 === ans.t2) {
                showFeedback(true);
                els.nextBtn.classList.remove('hidden');
                hideKeyboard();
            } else {
                showFeedback(false, `${ans.t1} ${ans.op} ${ans.t2}`);
            }
        }

        function checkPlay2Answer() {
            const i = state.pm2_inputs;
            const a = state.correctAnswer;
            
            if(i.t1 === a.t1 && i.op1 === a.op1 && i.t2 === a.t2 && i.op2 === a.op2 && i.t3 === a.t3) {
                 showFeedback(true);
                 els.nextBtn.classList.remove('hidden');
                 hideKeyboard();
            } else {
                 showFeedback(false, `${a.t1} ${a.op1} ${a.t2} ${a.op2} ${a.t3}`);
            }
        }

        function showFeedback(isCorrect, realAns = "") {
            els.bubble.classList.remove('hidden', 'bg-green-500', 'bg-red-500');
            els.bubble.classList.add(isCorrect ? 'bg-green-500' : 'bg-red-500');
            
            els.icon.innerText = isCorrect ? '✅' : '❌';
            if(isCorrect) {
                els.msg.innerText = state.lang === 'en' ? 'Correct!' : '答對了！';
            } else {
                els.msg.innerText = (state.lang === 'en' ? 'Wrong. ' : '答錯。') + dict[state.lang].real_ans + realAns;
            }
            
            els.bubble.style.opacity = '1';
            els.bubble.classList.add('animate-bounce');
            setTimeout(() => els.bubble.classList.remove('animate-bounce'), 1000);
            
            if(isCorrect) {
                setTimeout(() => els.bubble.style.opacity = '0', 3000);
            }
        }

        function hideFeedback() {
            els.bubble.classList.add('hidden');
            els.bubble.style.opacity = '0';
        }

        window.onload = init;
    </script>
</body>
